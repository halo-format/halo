# Halo Python workspace root (second target).
# Each package under packages/ is published as its own distribution on PyPI under the
# halo-format namespace, for the same lightest-install reason as the TS scope.

[tool.uv.workspace]
members = ["packages/*", "conformance"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
# importlib mode lets packages share test-file basenames (e.g. each adapter has its own
# tests/test_install.py) without the prepend-mode "import file mismatch" collision.
addopts = "--import-mode=importlib"
