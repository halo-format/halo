[project]
name = "halo-format-claude"
version = "0.3.1"
description = "Halo adapter for Claude on two runtimes (Python): the Agent SDK (install_halo — a PostToolUse encode hook + a single in-process halo_fetch MCP tool) and the raw Messages API (halo_format_claude.raw — create_raw_halo, no Agent SDK needed). Tool results become a shape map kept out of context."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Only the core is required. The Agent SDK is an optional extra (claude-agent-sdk), so the raw
# Messages API path (`import halo_format_claude.raw`) installs and runs without it; install
# `halo-format-claude[agent-sdk]` for the install_halo hook adapter. The package imports the SDK
# lazily so the raw submodule never touches it.
dependencies = ["halo-format"]

[project.optional-dependencies]
agent-sdk = ["claude-agent-sdk>=0.2.0"]

[project.urls]
Homepage = "https://github.com/halo-format/halo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halo_format_claude"]

[tool.uv.sources]
halo-format = { workspace = true }
