[project]
name = "halo-format-claude"
version = "0.0.0"
description = "Halo host adapter for the Claude Agent SDK (Python): a PostToolUse encode hook plus in-process halo_walk / halo_fetch MCP tools. install_halo() wires it in one call."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# The adapter is a separate opt-in package; depending on the host SDK the consumer already has is
# correct. The "lightest install" principle is about the core (halo-format), which stays zero-dep.
dependencies = ["halo-format", "claude-agent-sdk>=0.2.0"]

[project.urls]
Homepage = "https://github.com/halo-format/halo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halo_format_claude"]

[tool.uv.sources]
halo-format = { workspace = true }
