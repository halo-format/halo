[project]
name = "halo-format-openai"
version = "0.3.0"
description = "Halo host adapter for the OpenAI Agents SDK (Python): a call_model_input_filter that swaps large tool results for a shape map (out of context) plus a halo_fetch navigation tool. install_halo() wires it in one call."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# The adapter is a separate opt-in package; depending on the host framework the consumer already has is
# correct. The "lightest install" principle is about the core (halo-format), which stays zero-dep.
dependencies = ["halo-format", "openai-agents>=0.1"]

[project.urls]
Homepage = "https://github.com/halo-format/halo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halo_format_openai"]

[tool.uv.sources]
halo-format = { workspace = true }
