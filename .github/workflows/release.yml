name: Release

# Changesets-driven release for every package on one shared version.
#
# Flow:
#   1. Feature PRs land on main carrying a `.changeset/*.md` file (run `pnpm changeset`).
#   2. This workflow opens/updates a "release: version packages" PR that bumps every
#      package (npm + PyPI, kept in lockstep) and writes changelogs.
#   3. Merging that PR to main runs this workflow again; with no changesets left and the
#      version not yet tagged, it publishes to npm and creates ONE `vX.Y.Z` git tag and a
#      single GitHub release covering all packages.
#
# The PyPI packages are published by separate, per-package workflows (`publish-python-halo.yml`,
# `publish-python-claude.yml`, `publish-python-langgraph.yml`, `publish-python-openai.yml`). Each
# PyPI project only allows one trusted publisher per (repo, workflow file, environment), so each
# project needs its own workflow file — they cannot share this one. Those workflows trigger
# automatically off this one via `workflow_run` (a `push`/`release` trigger would NOT fire, because
# the tag and release created here use GITHUB_TOKEN, which GitHub suppresses to prevent workflow loops).
#
# Publishing is decoupled from the Changesets action on purpose: the action ONLY opens the
# version PR here (its `published` output is unreliable once per-package git tags are
# suppressed), and explicit steps below do the publish so the single-tag behaviour is exact.
#
# Auth:
#   - npm  — automation token in the NPM_TOKEN repo secret (published with provenance).
#   - PyPI — handled by the per-package workflows via OIDC trusted publishing (see those files).
# Repo settings also need the `release` environment and "Allow GitHub Actions to create and
# approve pull requests" enabled.

on:
  push:
    branches: [main]

permissions:
  contents: write # push the version PR branch, create the tag + GitHub release
  pull-requests: write # open/update the "version packages" PR
  id-token: write # npm provenance attestation

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org # writes the token-auth .npmrc

      # A recent npm so provenance attestation is generated reliably.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install workspace
        working-directory: ts
        run: pnpm install --frozen-lockfile

      # Open/update the "version packages" PR while changesets are pending. No publishing here.
      - name: Create the version PR
        id: changesets
        uses: changesets/action@v1
        with:
          cwd: ts
          version: pnpm run version
          title: "release: version packages"
          commit: "release: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish only when there is nothing left to version (the version PR was merged) and
      # this version has not been released yet (no `vX.Y.Z` tag).
      - name: Decide whether to publish
        id: gate
        env:
          HAS_CHANGESETS: ${{ steps.changesets.outputs.hasChangesets }}
        run: |
          VERSION="$(node -p "require('./ts/packages/halo/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$HAS_CHANGESETS" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "Pending version PR — not publishing."; exit 0
          fi
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "v$VERSION already released — nothing to do."; exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"; echo "Releasing v$VERSION."

      - name: Publish to npm
        if: steps.gate.outputs.publish == 'true'
        working-directory: ts
        # --no-git-tag: we create one shared `vX.Y.Z` tag below instead of per-package tags.
        run: pnpm -r build && pnpm changeset publish --no-git-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag and create the GitHub release
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          TAG="v$VERSION"
          awk -v v="$VERSION" '
            $0 == "## " v {f=1; next}
            /^## / {f=0}
            f {print}
          ' ts/packages/halo/CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
          # The vX.Y.Z tag created above is what the per-package PyPI workflows key off of
          # (via their own version<->tag gate) once this run completes.
