name: Release

# Changesets-driven release for all four packages on one shared version.
#
# Flow:
#   1. Feature PRs land on main carrying a `.changeset/*.md` file (run `pnpm changeset`).
#   2. This workflow opens/updates a "release: version packages" PR that bumps every
#      package (npm + PyPI, kept in lockstep) and writes changelogs.
#   3. Merging that PR to main runs this workflow again; with the versions bumped and no
#      changesets left, it publishes to npm and PyPI, then creates ONE git tag `vX.Y.Z`
#      and a single GitHub release covering all four packages.
#
# Auth:
#   - npm  — automation token in the NPM_TOKEN repo secret (published with provenance).
#   - PyPI — OIDC trusted publishing, no stored token (configure a trusted publisher on each
#            PyPI project pointing at this repo, workflow `release.yml`, environment `release`).
# Repo settings also need the `release` environment and "Allow GitHub Actions to create and
# approve pull requests" enabled.

on:
  push:
    branches: [main]

permissions:
  contents: write # push the version PR branch, create the tag + GitHub release
  pull-requests: write # open/update the "version packages" PR
  id-token: write # PyPI OIDC trusted publishing + npm provenance attestation

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org # writes the token-auth .npmrc

      # A recent npm so provenance attestation is generated reliably.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install workspace
        working-directory: ts
        run: pnpm install --frozen-lockfile

      - name: Create Release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          cwd: ts
          version: pnpm run version
          publish: pnpm run release # `changeset publish --no-git-tag` — we tag once below
          title: "release: version packages"
          commit: "release: version packages"
          createGithubReleases: false # one unified release is created below, not per-package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # used by `changeset publish` -> `npm publish`

      # ---- Single tag + GitHub release for the shared version (after npm is published) ----
      - name: Tag and create the GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./ts/packages/halo/package.json').version")"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            exit 0
          fi
          # Notes = this version's section from the core changelog; fall back to autogenerated.
          awk -v v="$VERSION" '
            $0 == "## " v {f=1; next}
            /^## / {f=0}
            f {print}
          ' ts/packages/halo/CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi

      # ---- PyPI: only on a run that actually published the npm packages ----
      - name: Set up Python
        if: steps.changesets.outputs.published == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build Python distributions
        if: steps.changesets.outputs.published == 'true'
        # Re-sync the version from the just-released npm package so the sdist/wheel carry
        # it even if the version step's pyproject edit (outside the Changesets cwd) was
        # not committed. Idempotent.
        run: |
          node ts/scripts/sync-python-version.mjs
          python -m pip install --upgrade build
          python -m build py/packages/halo  --outdir dist-python
          python -m build py/packages/claude --outdir dist-python

      - name: Publish halo-format + halo-format-claude to PyPI
        if: steps.changesets.outputs.published == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-python
