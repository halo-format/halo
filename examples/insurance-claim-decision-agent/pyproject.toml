[project]
name = "insurance-claim-decision-agent"
version = "0.1.0"
description = "Human-in-the-loop insurance claim adjudication agent built on the Claude Agent SDK, with a deterministic money engine, content-addressed evidence, and an opt-in Halo integration for token comparison."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.0",
    "mcp>=1.2.0",
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    # Published Halo packages (PyPI). The core also gives the MCP server byte-identical
    # content-addressed handles for the evidence record; the adapter powers the HALO=1 run.
    "halo-format>=0.1.1",
    "halo-format-claude>=0.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
payer-mcp = "mcp_servers.mimic_payer.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_servers", "agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
