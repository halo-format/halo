[project]
name = "insurance-claim-langgraph"
version = "0.1.0"
description = "LangGraph port of the insurance-claim-decision-agent: a prebuilt tool-calling agent (LangChain v1 / LangGraph) with ChatAnthropic over the same deterministic engine. Ships without a Halo integration — the Halo LangGraph adapter attaches separately."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-anthropic>=1.0",
    "asyncpg>=0.29",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "db"]
